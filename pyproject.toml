# Egress has no runtime dependencies. ruff and mypy are development tools,
# installed by CI and never imported, so `python -m egress.crawl` needs nothing
# but a Python interpreter.

[project]
name = "egress"
version = "0.1.0"
description = "What it costs to leave a tokenized-stock position"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["BLE001", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["egress"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

name: Egress crawl

# The crawl is the only part of this project that cannot be caught up later. An
# hour not recorded is an hour nobody can go back for, so it runs on a schedule
# rather than by hand.
#
# GitHub caps a job at 6 hours and treats cron as best effort - a sibling project
# saw delays of 1h23m, 1h52m and 3h17m in one week. So this is a LONG-RUNNING JOB,
# not a cron tick: each run loops for 5.5 hours and commits as it goes. A delayed
# start costs a gap, and `--coverage` reports gaps rather than hiding them.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "how long to crawl (leaves room for the closing commit)"
        default: "5.5"

concurrency:
  group: egress-crawl        # never two writers on one append-only store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 5.5h of crawling + up to 20 min for the loop to notice and the tail to
    # commit, inside GitHub's 6h ceiling. The old 5.8h left the final in-loop
    # commit to be killed mid-sleep.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # `git pull --rebase` needs real history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Crawl
        run: |
          python -m egress.crawl --loop --hours "${{ inputs.hours || '5.5' }}" &
          CRAWL=$!
          git config user.name  "egress-bot"
          git config user.email "noreply@github.com"
          # Commit every 20 min so a reclaimed runner costs minutes, not a shift.
          while kill -0 $CRAWL 2>/dev/null; do
            sleep 1200
            bash .github/commit-record.sh || echo "::warning::commit cycle failed"
          done
          wait $CRAWL || true

      - name: Commit the tail
        if: always()
        run: |
          git config user.name  "egress-bot"
          git config user.email "noreply@github.com"
          bash .github/commit-record.sh

      - name: Coverage
        if: always()
        run: python -m egress.crawl --coverage
